name: projects-service

# Images build after the tests pass. Only main and v* tags publish them.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - projects-service/**
      - .github/workflows/projects-service.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  projects-service:
    runs-on: [self-hosted, isep]
    env:
      PROJECTS_TEST_DB: Host=localhost;Port=5432;Username=projects;Password=projects;Database=projects_test
    steps:
      - uses: actions/checkout@v7

      # The runner host can only run host-network containers, so Postgres
      # runs as a step instead of a service container.
      - name: Start Postgres
        run: |
          docker rm -f projects-test-db 2>/dev/null || true
          docker run -d --name projects-test-db --network host \
            -e POSTGRES_USER=projects -e POSTGRES_PASSWORD=projects -e POSTGRES_DB=projects_test \
            postgres:17
          until docker exec projects-test-db pg_isready -h localhost -U projects; do sleep 2; done

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('projects-service/Directory.Packages.props', 'projects-service/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Apply schema
        run: |
          for f in projects-service/database/schema/V1__create_tables.sql projects-service/database/mock/V1_1__load_mock_data.sql; do
            docker exec -i projects-test-db psql -U projects -d projects_test -v ON_ERROR_STOP=1 < "$f"
          done

      - name: Test
        run: dotnet test projects-service/ProjectsService.sln -c Release

      - name: Stop Postgres
        if: always()
        run: docker rm -f projects-test-db

  images:
    needs: projects-service
    runs-on: [self-hosted, isep]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: service
            file: Dockerfile
          - name: migrations
            file: DockerfileFlyway
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/projects-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: projects-service
          file: projects-service/${{ matrix.file }}
          # PR images are never pushed, so skip the arm64 build there.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
