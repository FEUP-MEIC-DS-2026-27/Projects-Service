name: projects-service

# Images build after the tests pass. Only main and v* tags publish them.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - projects-service/**
      - .github/workflows/projects-service.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  projects-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: projects
          POSTGRES_PASSWORD: projects
          POSTGRES_DB: projects_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projects"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECTS_TEST_DB: Host=localhost;Port=5432;Username=projects;Password=projects;Database=projects_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('projects-service/Directory.Packages.props', 'projects-service/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Apply schema
        env:
          PGPASSWORD: projects
        run: |
          psql -h localhost -U projects -d projects_test -v ON_ERROR_STOP=1 -f projects-service/database/schema/V1__create_tables.sql
          psql -h localhost -U projects -d projects_test -v ON_ERROR_STOP=1 -f projects-service/database/mock/V1_1__load_mock_data.sql

      - name: Test
        run: dotnet test projects-service/ProjectsService.sln -c Release

  images:
    needs: projects-service
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: service
            file: Dockerfile
          - name: migrations
            file: DockerfileFlyway
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/projects-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: projects-service
          file: projects-service/${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
